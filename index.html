<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="POINTPRO">
<link rel="manifest" href="manifest.json">
<title>POINTPRO — Pointage mobile</title>
<style>
:root{--bg:#0b1220;--card:#111c33;--card2:#0d1626;--line:#23324e;--mut:#8ea3c2;--txt:#eaf1fb;--cy:#22d3ee;--gr:#34d399;--or:#fbbf24;--rd:#f87171;--vio:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;padding-bottom:76px;overscroll-behavior-y:contain}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:#0a1322;border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-height:46px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cy)}
label.fld{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 5px}
.h{font-size:20px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;color:var(--cy)}
.card h3.gr{color:var(--gr)}.card h3.or{color:var(--or)}.card h3.rd{color:var(--rd)}.card h3.vio{color:var(--vio)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#1b2a47;border:1px solid #2c426b;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;min-height:46px;user-select:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#0ea5e9,#34d399);border:none;color:#04222b}
.btn.warn{background:#7c2d12;border-color:#a13a12;color:#fed7aa}
.btn.ghost{background:transparent}
.btn.blk{width:100%}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.4px}
.pill.ok{background:#064e3b;color:#6ee7b7}.pill.no{background:#7f1d1d;color:#fca5a5}.pill.wn{background:#78350f;color:#fcd34d}.pill.inf{background:#164e63;color:#67e8f9}
.topbar{position:sticky;top:0;z-index:50;background:#0a1322e8;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;padding-top:calc(12px + env(safe-area-inset-top))}
.topbar .brand{font-weight:900;font-size:17px;background:linear-gradient(135deg,#22d3ee,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar select{max-width:40vw;flex:1}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#0a1322f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;color:var(--mut);font-size:10.5px;font-weight:700;cursor:pointer;border-top:2px solid transparent}
.tab .ic{font-size:21px}
.tab.on{color:var(--cy);border-top:2px solid var(--cy);background:#0d1c3088}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .t{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}
.stat .v{font-size:19px;font-weight:900;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mut{color:var(--mut)}
.small{font-size:12px}
.msg{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.5}
.msg.ok{background:#052e1c;border:1px solid #14532d;color:#a7f3d0}
.msg.no{background:#3f0d0d;border:1px solid #7f1d1d;color:#fca5a5}
.msg.wn{background:#362405;border:1px solid #713f12;color:#fde68a}
.msg.inf{background:#082744;border:1px solid #0c4a6e;color:#a5f3fc}
.sheet{position:fixed;inset:0;z-index:100;background:#000a;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .inner{background:var(--card2);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;width:100%;padding:18px 18px 40px;border-top:1px solid var(--line)}
.grip{width:44px;height:5px;background:#334155;border-radius:9px;margin:0 auto 14px}
.qrbox{background:#fff;padding:10px;border-radius:12px;display:inline-block}
.badge-card{width:100%;max-width:420px;background:#fff;color:#0f172a;border-radius:14px;overflow:hidden;display:flex;font-family:Arial,sans-serif;border:1px solid #cbd5e1}
.badge-left{width:38%;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:linear-gradient(160deg,#0e7490,#065f46);color:#fff}
.badge-left img,.badge-left .ph{width:74%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:#334155;display:flex;align-items:center;justify-content:center;font-size:10px;color:#94a3b8}
.badge-right{flex:1;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between}
.badge-right .co{font-size:9.5px;font-weight:800;color:#0e7490;text-transform:uppercase;line-height:1.2}
.badge-right .nm{font-size:15px;font-weight:900;margin:2px 0;line-height:1.1}
.badge-right .fn{font-size:10px;color:#475569;font-weight:700}
.badge-right .id{font-size:9.5px;font-weight:800;color:#334155;letter-spacing:.5px}
.badge-right .qr{display:flex;gap:8px;align-items:center}
.badge-right .qr img{width:64px;height:64px}
.badge-right .qr .hint{font-size:7px;color:#94a3b8;line-height:1.3}
.avatar{width:44px;height:44px;border-radius:12px;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.lrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card2);margin-bottom:10px}
.lrow:active{background:#152238}
.lrow .nm{font-weight:800}
.lrow .sub{font-size:12px;color:var(--mut);margin-top:2px}
.lrow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
table.d{width:100%;border-collapse:collapse;font-size:12.5px}
table.d th{text-align:left;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:7px 8px;border-bottom:1px solid var(--line)}
table.d td{padding:8px;border-bottom:1px solid #1b2942}
.tblwrap{overflow-x:auto}
#view{padding:14px 14px 30px;max-width:760px;margin:0 auto}
#scanbox{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
#scanbox video{width:100%;height:100%;object-fit:cover}
#scanframe{position:absolute;width:72%;aspect-ratio:1;border:3px solid #22d3ee55;border-radius:18px;box-shadow:0 0 0 1000px #0006;pointer-events:none}
#scanflash{position:absolute;inset:0;background:#34d399;opacity:0;pointer-events:none;transition:opacity .25s}
.scanbig{font-size:15px;font-weight:900}
.counter{font-size:12px;font-weight:800;padding:6px 10px;border-radius:10px;background:#0a1322}
.hide{display:none!important}
.sw{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{flex-shrink:0;padding:10px 16px;border-radius:99px;background:#13233d;border:1px solid var(--line);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,#0ea5e9,#34d399);color:#04222b;border-color:transparent}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media (min-width:640px){.kpi{grid-template-columns:repeat(4,1fr)}}
details.faq{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--card2)}
details.faq summary{cursor:pointer;font-weight:700}
details.faq .b{margin-top:8px;color:var(--mut);line-height:1.7;font-size:14px}
.bigbtn{width:100%;padding:16px;font-size:17px;font-weight:900;border-radius:14px;border:none;background:linear-gradient(135deg,#0ea5e9,#34d399);color:#04222b;cursor:pointer}
.bigbtn:active{transform:scale(.98)}
@media print{body{background:#fff;color:#000;padding:0}.noprint{display:none!important}.tabbar,.topbar{display:none!important}#view{padding:0;max-width:none}.card{border:none;background:#fff;color:#000}h3{color:#000!important}.prbadge{page-break-inside:avoid}}
</style>
</head>
<body>
<div id="login" style="display:none;min-height:100vh;padding:28px 20px;max-width:430px;margin:0 auto">
  <div style="text-align:center;padding:26px 0 10px">

    <div style="font-size:30px;font-weight:900;background:linear-gradient(135deg,#22d3ee,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent">POINTPRO</div>

</div>

</div>
<div class="sheet" id="sheet" onclick="if(event.target===this)App.closeSheet()"><div class="inner" id="sheetBody"></div></div>
<script>
"use strict";
// ================== MOTEUR BINAIRE (ZIP/PNG/QR/DOCX/XLSX) ==================
function u8(s){var u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u}

function b64enc(u){var A="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/",r="";for(var i=0;i<u.length;i+=3){var b0=u[i],b1=i+1<u.length?u[i+1]:0,b2=i+2<u.length?u[i+2]:0,n=(b0<<16)|(b1<<8)|b2;r+=A[n>>18&63]+A[n>>12&63]+(i+1<u.length?A[n>>6&63]:"=")+(i+2<u.length?A[n&63]:"=")}return r}
function b64dec(s){var A="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/",m={};for(var i=0;i<64;i++)m[A[i]]=i;s=s.replace(/[^A-Za-z0-9+\/]/g,"");var out=[],j=0;for(var i=0;i<s.length;i+=4){var n=(m[s[i]]<<18)|(m[s[i+1]]<<12)|((m[s[i+2]]||0)<<6)|(m[s[i+3]]||0);out.push(n>>16&255);if(s[i+2])out.push(n>>8&255);if(s[i+3])out.push(n&255)}return new Uint8Array(out)}
function zipStore(files){var parts=[],cd=[],off=0;
  files.forEach(function(f){var nm=u8(f.name),crc=crc32(f.data),sz=f.data.length;
    var lh=new Uint8Array(30+nm.length),d=new DataView(lh.buffer);
    d.setUint32(0,0x04034b50,true);d.setUint16(4,20,true);d.setUint16(6,0,true);d.setUint16(8,0,true);
    d.setUint16(10,0,true);d.setUint16(12,0x21,true);d.setUint32(14,crc,true);
    d.setUint32(18,sz,true);d.setUint32(22,sz,true);d.setUint16(26,nm.length,true);d.setUint16(28,0,true);lh.set(nm,30);
    parts.push(lh,f.data);
    var ch=new Uint8Array(46+nm.length),c=new DataView(ch.buffer);
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0,true);
    c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);
    c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint16(30,0,true);
    c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);ch.set(nm,46);
    cd.push(ch);off+=lh.length+sz});
  var cds=cd.reduce(function(s,c){return s+c.length},0);
  var eo=new Uint8Array(22),e=new DataView(eo.buffer);
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
  e.setUint32(12,cds,true);e.setUint32(16,off,true);
  return cat(parts.concat(cd,[eo]))}
// ---- PNG (deflate stocké, niveaux de gris) ----
function adler32(b){var a=1,c=0;for(var i=0;i<b.length;i++){a=(a+b[i])%65521;c=(c+a)%65521}return((c<<16)|a)>>>0}
function pngChunk(t,d){var l=new Uint8Array(4);new DataView(l.buffer).setUint32(0,d.length,false);
  var c=new Uint8Array(4);new DataView(c.buffer).setUint32(0,crc32(cat([u8(t),d])),false);return cat([l,u8(t),d,c])}
function pngGray(w,h,pix){var ih=new Uint8Array(13),v=new DataView(ih.buffer);
  v.setUint32(0,w);v.setUint32(4,h);ih[8]=8;ih[9]=0;
  var raw=new Uint8Array(h*(w+1));
  for(var y=0;y<h;y++){raw[y*(w+1)]=0;for(var x=0;x<w;x++)raw[y*(w+1)+1+x]=pix[y*w+x]}
  var bl=[],p=0;
  while(p<raw.length){var n=Math.min(65535,raw.length-p),b=new Uint8Array(5+n);
    b[0]=p+n>=raw.length?1:0;b[1]=n&255;b[2]=(n>>8)&255;b[3]=(~n)&255;b[4]=((~n)>>8)&255;b.set(raw.subarray(p,p+n),5);bl.push(b);p+=n}

// ---- QR Code (versions 1-3, correction M, masque 0) — conforme ISO/IEC 18004 ----
var QRSPC=[{n:21,dc:16,ec:10},{n:25,dc:28,ec:16},{n:29,dc:44,ec:26}];
var GFEXP=new Array(256),GFLOG=new Array(256);
(function(){var x=1;for(var i=0;i<255;i++){GFEXP[i]=x;GFLOG[x]=i;x<<=1;if(x&0x100)x^=0x11d}GFEXP[255]=GFEXP[0]})();
function gmul(a,b){if(!a||!b)return 0;return GFEXP[(GFLOG[a]+GFLOG[b])%255]}
function rsGen(n){var g=[1];for(var i=0;i<n;i++){var a=GFEXP[i],ng=new Array(g.length+1);
  for(var k=0;k<=g.length;k++)ng[k]=((k<g.length?g[k]:0)^(k>0?gmul(a,g[k-1]):0));g=ng}return g.reverse()}
function rsEnc(msg,n){var gen=rsGen(n),res=msg.slice();for(var k=0;k<n;k++)res.push(0);
  for(var i=0;i<msg.length;i++){var f=res[i];if(f)for(var j=1;j<gen.length;j++)res[i+j]^=gmul(gen[j],f)}
  return res.slice(msg.length)}
function qrEncode(str){
  var bytes=[];for(var i=0;i<str.length;i++){var c=str.charCodeAt(i);
    if(c<128)bytes.push(c);else if(c<2048)bytes.push(0xc0|c>>6,0x80|c&63);else bytes.push(0xe0|c>>12,0x80|c>>6&63,0x80|c&63)}
  var sp=null;for(var i=0;i<QRSPC.length;i++)if(bytes.length<=QRSPC[i].dc){sp=QRSPC[i];break}
  if(!sp)throw new Error("Contenu trop long pour le QR Code")
  var bits="0100"+("00000000"+bytes.length.toString(2)).slice(-8);
  bytes.forEach(function(b){bits+=("00000000"+b.toString(2)).slice(-8)});
  var cap=sp.dc*8;bits+="0000".slice(0,Math.min(4,cap-bits.length));
  while(bits.length%8)bits+="0";
  var cw=[];for(var i=0;i<bits.length;i+=8)cw.push(parseInt(bits.substr(i,8),2));
  var pad=[0xEC,0x11],p=0;while(cw.length<sp.dc)cw.push(pad[p++%2]);
  var full=cw.concat(rsEnc(cw,sp.ec));
  // ---- matrice ----
  var size=sp.n,m=[];for(var y=0;y<size;y++){m.push([]);for(var x=0;x<size;x++)m[y].push(null)}
  function put(x,y,v){if(x>=0&&y>=0&&x<size&&y<size)m[y][x]=v}
  function finder(cx,cy){for(var dy=-1;dy<=7;dy++)for(var dx=-1;dx<=7;dx++){
    put(cx+dx,cy+dy,(dx>=0&&dx<=6&&dy>=0&&dy<=6)?((dx>=2&&dx<=4&&dy>=2&&dy<=4)||(dx===0||dx===6||dy===0||dy===6)):false)}}
  finder(0,0);finder(size-7,0);finder(0,size-7);
  for(var i=8;i<size-8;i++){if(m[6][i]===null)m[6][i]=i%2===0;if(m[i][6]===null)m[i][6]=i%2===0}
  var ac=size===25?18:size===29?22:-1;
  if(ac>0)[[6,ac],[ac,6],[ac,ac]].forEach(function(q){
    for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++){var x=q[0]+dx,y=q[1]+dy;
      if(m[y]&&m[y][x]===null)m[y][x]=Math.max(Math.abs(dx),Math.abs(dy))!==1}});

  var fb=0x5412,gb=function(i){return((fb>>i)&1)!==0};
  var c1=[[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[7,8],[8,8],[8,7],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0]];
  var c2=[[8,size-1],[8,size-2],[8,size-3],[8,size-4],[8,size-5],[8,size-6],[8,size-7],[8,size-8],[size-7,8],[size-6,8],[size-5,8],[size-4,8],[size-3,8],[size-2,8],[size-1,8]];
  for(var i=0;i<15;i++){m[c1[i][0]][c1[i][1]]=gb(i);m[c2[i][0]][c2[i][1]]=gb(i)}
  var bs="";full.forEach(function(b){bs+=("00000000"+b.toString(2)).slice(-8)});
  var bi=0;
  for(var right=size-1;right>0;right-=2){
    if(right===6)right--;
    for(var vert=0;vert<size;vert++)for(var j=0;j<2;j++){
      var x=right-j,up=((right+1)&2)===0,y=up?(size-1-vert):vert;
      if(m[y][x]===null&&bi<bs.length){var v=bs[bi]==="1";bi++;if((x+y)%2===0)v=!v;m[y][x]=v}}}

  return{m:m,size:size}}

    pix[y*w+x]=(mx>=0&&my>=0&&mx<q.size&&my<q.size&&q.m[my][mx])?0:255}
  return pngGray(w,w,pix)}
function qrDataUrl(str,px){return"data:image/png;base64,"+b64enc(qrPng(str,px||8))}
// ---- DOCX / XLSX ----
function escX(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
var MM_TW=56.6929,MM_EMU=36000;

<script>

directeur:["view","times","claims","pay","reports","audit","correct"],

var SECTORS={
btp:{label:"Bâtiment et travaux publics",t:{site:"Chantier",worker:"Ouvrier",team:"Équipe",chief:"Chef de chantier",assign:"Affectation"},kpi:["Heures chantier","Jours travaillés"]},

industrie:{label:"Industrie et production",t:{site:"Atelier",worker:"Opérateur",team:"Équipe",chief:"Chef d’atelier",assign:"Poste"},kpi:["Heures de production","Postes couverts"]},

agro:{label:"Agroalimentaire",t:{site:"Site",worker:"Opérateur",team:"Équipe",chief:"Chef d’équipe",assign:"Ligne"},kpi:["Heures","Journées"]},

manutention:{label:"Manutention",t:{site:"Site",worker:"Manutentionnaire",team:"Équipe",chief:"Chef d’équipe",assign:"Mission"},kpi:["Heures","Journées"]},
commerce:{label:"Commerce et distribution",t:{site:"Magasin",worker:"Agent",team:"Équipe",chief:"Responsable",assign:"Service"},kpi:["Heures","Journées"]},

function uid(p){return(p||"")+"x"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function hsh(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;for(var r=0;r<800;r++){h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0}return h.toString(36)}
function today(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function nowTime(d){d=d||new Date();return("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function dLabel(iso){if(!iso)return"—";var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function wLabel(iso){var d=new Date(iso+"T00:00:00");return["dim","lun","mar","mer","jeu","ven","sam"][d.getDay()]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
// ---- base ----
var DB;
function dbLoad(){try{DB=JSON.parse(localStorage.getItem(LSK))||null}catch(e){DB=null}
  if(!DB||!DB.companies){DB={companies:[],users:[],workers:[],badges:[],sites:[],teams:[],sessions:[],events:[],claims:[],payments:[],audit:[],notifs:[],meta:{ver:1}};dbSave()}}
function dbSave(){try{localStorage.setItem(LSK,JSON.stringify(DB))}catch(e){App.toast("⚠️ Stockage plein : exporte une sauvegarde","no")}}
function sc(list){var cid=App.user()&&App.user().companyId;return list.filter(function(x){return x.companyId===cid})} // ISOLEMENT TENANT
function audit(action,entity,entityId,before,after,motif){var u=App.user();
  DB.audit.push({id:uid("a"),companyId:u?u.companyId:null,ts:new Date().toISOString(),actorId:u?u.id:null,actorName:u?u.name:"—",
    action:action,entity:entity,entityId:entityId,before:before==null?null:JSON.stringify(before),after:after==null?null:JSON.stringify(after),motif:motif||""});
  if(DB.audit.length>3000)DB.audit=DB.audit.slice(-2500);dbSave()}
function notify(txt,kind){DB.notifs.unshift({id:uid("n"),companyId:App.user()?App.user().companyId:null,ts:new Date().toISOString(),txt:txt,kind:kind||"inf",read:false});
  DB.notifs=DB.notifs.slice(0,200);dbSave()}
// ---- sessions & événements de pointage ----
var OPS={arrivee:"Arrivée",depart:"Départ",pauseDebut:"Début pause",pauseFin:"Fin pause"};
function evKey(e){return e.workerId+"|"+e.date+"|"+e.type}
function workerEvents(wId,date){return sc(DB.events).filter(function(e){return e.workerId===wId&&e.date===date}).sort(function(a,b){return a.time<b.time?-1:1})}
// Calcul d’une journée : arrivee, pauses, depart, presence, effectif, retard, HS, nuit, incomplet
function computeDay(wId,date){
  var evs=workerEvents(wId,date),r={date:date,arrivee:null,depart:null,pauses:[],presence:0,pauseTot:0,effectif:0,retard:false,departAnticipe:false,hs:0,nuit:false,incomplet:false,events:evs};
  var arr=evs.filter(function(e){return e.type==="arrivee"}),dep=evs.filter(function(e){return e.type==="depart"}),pd=evs.filter(function(e){return e.type==="pauseDebut"}),pf=evs.filter(function(e){return e.type==="pauseFin"});
  if(arr.length)r.arrivee=arr[arr.length-1].time;
  if(dep.length)r.depart=dep[dep.length-1].time;
  var i=0,j=0;
  while(i<pd.length||j<pf.length){var st=pd[i]?pd[i].time:null,en=pf[j]?pf[j].time:null;
    if(st&&en&&en>=st){r.pauses.push([st,en]);i++;j++}else if(st&&!en){r.pauses.push([st,null]);i++}else if(en&&!st){j++}else{break}}
  function mins(t){var p=t.split(":");return+p[0]*60+(+p1(p[1]))}
  function p1(x){return x}
  if(r.arrivee&&r.depart){var a=mins(r.arrivee),d=mins(r.depart);if(d<a)d+=1440; // passage minuit
    r.presence=(d-a)/60;
    r.pauses.forEach(function(p){if(p[1]){var s=mins(p[0]),e2=mins(p[1]);if(e2<s)e2+=1440;r.pauseTot+=(e2-s)/60}});
    r.effectif=Math.max(0,r.presence-r.pauseTot);
    var w=App.workerById(wId),st=w?(w.hStart||"08:00"):"08:00",et=w?(w.hEnd||"17:00"):"17:00";
    if(a>mins(st))r.retard=true;
    if(d<mins(et))r.departAnticipe=true;
    var base=w?(+w.hsBase||8):8;
    r.hs=Math.max(0,r.effectif-base);
    var nightStart=21*60,nightEnd=6*60;
    for(var t=a;t<d;t++){var mm=t%1440;if(mm>=nightStart||mm<nightEnd){r.nuit=true;break}}
    if(r.pauses.some(function(p){return!p[1]}))r.incomplet=true;
  }else if(r.arrivee||r.depart){r.incomplet=true}
  if(r.pauses.some(function(p){return!p[1]})&&!r.depart)r.incomplet=true;
  return r}
function fmtH(h){var m=Math.round(h*60);return Math.floor(m/60)+"h"+("0"+(m%60)).slice(-2)}
function fmM(n){return new Intl.NumberFormat("fr-FR").format(Math.round(n))+" F"}
</script>
<script>

var App={

  document.getElementById("siteSel").innerHTML=sites.map(function(s){return"<option value=\""+s.id+"\""+(App.scan.siteId===s.id?" selected":"")+">"+esc(s.nom)+"</option>"}).join("");
  this.nav();
  var V={home:this.vHome,scan:this.vScan,workers:this.vWorkers,reports:this.vReports,more:this.vMore,self:this.vSelf,tests:this.vTests,audit:this.vAudit,guides:this.vGuides,claims:this.vClaims,pay:this.vPay,times:this.vTimes,settings:this.vSettings,users:this.vUsers,sites:this.vSites};
  document.getElementById("view").innerHTML=V[this.tab].call(this);

}catch(err){document.getElementById("view").innerHTML="<div class=\"msg no\">⚠️ Erreur d’affichage : "+esc(err.message)+" — réessaie, tes données sont sauvegardées.</div>"}},
sec:function(t,sub){return"<div style=\"margin-bottom:14px\"><div class=\"h\">"+t+"</div><div class=\"mut small\">"+sub+"</div></div>"},
notifCount:function(){var u=this.user();return DB.notifs.filter(function(n){return n.companyId===u.companyId&&!n.read}).length},
// ---------- TABLEAU DE BORD ----------
vHome:function(){var u=this.user();if(!can("view")&&u.role!=="ouvrier")return this.deny();
  var d=today(),ws=sc(DB.workers).filter(function(w){return w.statut==="actif"}),self=this;
  var days=ws.map(function(w){return computeDay(w.id,d)});
  var presents=days.filter(function(r){return r.arrivee}).length;
  var absents=ws.length-presents;
  var retards=days.filter(function(r){return r.retard}).length;
  var hsTot=days.reduce(function(s,r){return s+r.hs},0);
  var hTot=days.reduce(function(s,r){return s+r.effectif},0);
  var inc=days.filter(function(r){return r.incomplet}).length;
  var claimsOpen=sc(DB.claims).filter(function(c){return["nouvelle","encours","attente"].indexOf(c.status)>=0}).length;
  var ym=d.slice(0,7),totPay=ws.reduce(function(s,w){return s+self.payOf(w,ym).estimated},0);
  var mTot=ws.reduce(function(s,w){return s+self.payOf(w,ym).hours},0);
  var q=this.quinzRange(d),rowsPay=ws.map(function(w){var p=self.payRange(w,q.from,q.to);return{w:w,p:p}}),qPay=rowsPay.reduce(function(s,r){return s+r.p.estimated},0);
  var n=this.notifCount();
  return this.sec("Tableau de bord — "+dLabel(d),"Bienvenue "+esc(u.name)+" · "+ROLES[u.role])+
  (n?"<div class=\"msg inf\" onclick=\"App.setTab('more')\" style=\"cursor:pointer\">🔔 "+n+" notification(s) non lue(s) — touche pour voir</div>":"")+
  "<div class=\"kpi\">"+this.k("Travailleurs actifs",ws.length)+this.k("Présents aujourd’hui",presents,"gr")+
  this.k("Absents présumés",absents,absents?"or":"")+this.k("Retards",retards,retards?"or":"")+
  this.k("Heures travaillées",fmtH(hTot),"gr")+this.k("Heures supp.",fmtH(hsTot))+this.k("Journées incomplètes",inc,inc?"no":"")+
  this.k("Réclamations ouvertes",claimsOpen,claimsOpen?"or":"")+this.k("Total à payer ("+ym+")",fmM(totPay),"gr")+
  this.k("Heures ce mois ("+ym+")",fmtH(mTot),"gr")+this.k("À payer "+q.label,fmM(qPay),"gr")+"</div>"+
  "<div class=\"grid2\"><button class=\"btn primary\" onclick=\"App.setTab('scan')\">📷 Ouvrir le scan continu</button>"+
  "<button class=\"btn\" onclick=\"App.setTab('workers')\">👥 Gérer l’équipe</button></div>"+
  "<div class=\"card\" style=\"margin-top:14px\"><h3>📅 Heures du jour — qui, quand, combien</h3><table class=\"d\"><tr><th>Travailleur</th><th>Arrivée</th><th>Départ</th><th>Effectif</th><th>HS</th></tr>"+
  ws.map(function(w,i){var r=days[i];return "<tr><td>"+esc(w.prenom+" "+w.nom)+"</td><td>"+(r.arrivee||"—")+"</td><td>"+(r.depart||"—")+"</td><td>"+(r.arrivee?fmtH(r.effectif):"—")+"</td><td>"+(r.hs?fmtH(r.hs):"—")+"</td></tr>"}).join("")+"</table></div>"+
  "<div class=\"card\" style=\"margin-top:14px\"><h3>💰 À payer par ouvrier — "+q.label+" ("+dLabel(q.from)+" → "+dLabel(q.to)+")</h3>"+
  "<table class=\"d\"><tr><th>Ouvrier</th><th>Contrat</th><th>Jours val.</th><th>Heures</th><th>HS</th><th>À payer</th></tr>"+
  rowsPay.map(function(r){return "<tr><td>"+esc(r.w.prenom+" "+r.w.nom)+"</td><td>"+esc(r.w.mode)+" · "+fmM(r.w.tarif)+(r.w.mode==="journalier"?"/j":r.w.mode==="horaire"?"/h":"")+"</td><td>"+r.p.validDays+"</td><td>"+fmtH(r.p.hours)+"</td><td>"+fmtH(r.p.hs)+"</td><td class=\"green\"><b>"+fmM(r.p.estimated)+"</b></td></tr>"}).join("")+
  "<tr><th colspan=\"5\">Total "+q.label+"</th><th>"+fmM(qPay)+"</th></tr></table>"+
  "<div class=\"mut small\" style=\"margin-top:6px\">Cumulé depuis le début de la quinzaine (paie par quinzaine : 1re = 1→15, 2e = 16→fin de mois). Journalier : jours validés × montant/jour · Horaire : heures × taux, HS majorées ×"+this.hsMajor()+" · Mensuel : moitié du salaire mensuel.</div></div>"+
  "<div class=\"card\" style=\"margin-top:14px\"><h3>Activité récente</h3>"+this.recentList()+"</div>"},
k:function(t,v,c){return"<div class=\"stat\"><div class=\"t\">"+t+"</div><div class=\"v\" style=\"color:"+(c==="gr"?"var(--gr)":c==="or"?"var(--or)":c==="no"?"var(--rd)":"var(--txt)")+"\">"+v+"</div></div>"},
recentList:function(){var evs=sc(DB.events).slice().sort(function(a,b){return b.ts<a.ts?1:-1}).slice(0,8);
  if(!evs.length)return"<div class=\"mut small\">Aucun pointage enregistré pour le moment.</div>";
  return evs.map(function(e){var w=App.workerById(e.workerId),t=e.anomaly?"or":"ok";
    return"<div class=\"lrow\"><div class=\"avatar\">"+(w&&w.photo?"<img src=\""+w.photo+"\">":"👷")+"</div><div class=\"grow\"><div class=\"nm\">"+esc(w?w.prenom+" "+w.nom:"?")+"</div><div class=\"sub\"><b>"+wLabel(e.date)+" "+dLabel(e.date)+"</b> · "+OPS[e.type]+" · "+e.time+" · "+esc(App.siteById(e.sessionSiteId)?App.siteById(e.sessionSiteId).nom:"")+(e.anomaly?" · <b style='color:var(--or)'>anomalie</b>":"")+(e.offline?" · hors ligne":"")+"</div></div><span class=\"pill "+t+"\">"+(e.anomaly?"⚠":"✓")+"</span></div>"}).join("")},
deny:function(){return"<div class=\"msg no\">⛔ Ton rôle ne permet pas d’accéder à cet espace.</div>"},
vSelf:function(){var u=this.user(),w=this.workerById(u.workerId);if(!w)return this.deny();
  var d=today(),r=computeDay(w.id,d);
  return this.sec("Mon espace — "+esc(w.prenom+" "+w.nom),"Consulte tes heures et tes rémunérations")+
  "<div class=\"kpi\">"+this.k("Statut aujourd’hui",r.arrivee?(r.depart?"Terminé":"En service"):"Non pointé")+this.k("Heures aujourd’hui",fmtH(r.effectif))+"</div>"+
  "<div class=\"card\"><h3>Mes heures (jour · quinzaine · mois)</h3>"+this.hoursTabsHtml(w)+"</div>"+
  "<div class=\"mut small\" style=\"margin-top:4px\">Contrat : du "+dLabel(w.dateDebut)+(w.dateFin?" au "+dLabel(w.dateFin):" — en cours")+" · "+w.mode+" · "+fmM(w.tarif)+(w.mode==="journalier"?" / jour":"")+"</div>"+
  "<div class=\"card\" style=\"margin-top:10px\"><h3>Mes 7 derniers jours</h3><table class=\"d\"><tr><th>Jour</th><th>Date</th><th>Arrivée</th><th>Départ</th><th>Effectif</th><th>HS</th></tr>"+
  this.lastDays(w.id,7).map(function(rd){return"<tr><td>"+wLabel(rd.date)+"</td><td>"+dLabel(rd.date)+"</td><td>"+(rd.arrivee||"—")+"</td><td>"+(rd.depart||"—")+"</td><td>"+(rd.arrivee?fmtH(rd.effectif):"—")+"</td><td>"+(rd.hs?fmtH(rd.hs):"—")+"</td></tr>"}).join("")+"</table></div>"+
  "<div class=\"grid2\"><button class=\"btn\" onclick=\"App.newClaim('"+w.id+"')\">✋ Signaler une erreur</button><button class=\"btn\" onclick=\"App.myReleve('"+w.id+"')\">📄 Mon relevé</button></div>"},
lastDays:function(wId,n){var out=[],d=new Date();for(var i=0;i<n;i++){out.push(computeDay(wId,today(d)));d.setDate(d.getDate()-1)}return out},
myReleve:function(wId){this.reportsDocx("releve",[wId],today(),today())},
// ---- agrégats d’heures : jour / quinzaine / mois ----
hoursRange:function(wId,from,to){var d=new Date(from+"T00:00:00"),end=new Date(to+"T00:00:00"),tot=0,hs=0,days=0;
  while(d<=end){var dt=today(d),r=this.computeDayC(wId,dt);if(r.arrivee){tot+=r.effectif;hs+=r.hs;days++}d.setDate(d.getDate()+1)}
  return{hours:tot,hs:hs,days:days}},
quinzRange:function(d){var p=d.split("-"),y=+p[0],m=+p[1],day=+p[2];
  if(day<=15)return{from:y+"-"+("0"+m).slice(-2)+"-01",to:y+"-"+("0"+m).slice(-2)+"-15",label:"1re quinzaine"};
  var last=new Date(y,m,0).getDate();
  return{from:y+"-"+("0"+m).slice(-2)+"-16",to:y+"-"+("0"+m).slice(-2)+"-"+("0"+last).slice(-2),label:"2e quinzaine"}},
hoursTabsHtml:function(w){var d=today(),q=this.quinzRange(d),ym=d.slice(0,7);
  var hj=this.hoursRange(w.id,d,d),hq=this.hoursRange(w.id,q.from,q.to),hm=this.hoursRange(w.id,ym+"-01",d);
  var start=w.dateDebut&&w.dateDebut>d?w.dateDebut:d;
  return"<div class=\"kpi\">"+this.k("Jour ("+wLabel(d)+" "+dLabel(d)+")",fmtH(hj.hours))+
  this.k(q.label+" ("+dLabel(q.from)+" → "+dLabel(q.to)+")",fmtH(hq.hours))+
  this.k("Mois ("+ym+")",fmtH(hm.hours)+" · "+hm.days+" j")+"</div>"+
  (w.dateFin&&w.dateFin<d?"<div class=\"msg no\" style=\"margin-top:8px\">Départ le "+dLabel(w.dateFin)+" : les pointages postérieurs ne sont plus comptés.</div>":w.dateDebut&&w.dateDebut>d?"<div class=\"msg wn\" style=\"margin-top:8px\">Premier jour de travail : "+dLabel(w.dateDebut)+"</div>":"")}
};
function val(id){var e=document.getElementById(id);return e?e.value:""}
</script>
<script>
// ================== ÉQUIPE / BADGES ==================
Object.assign(App,{
vWorkers:function(){if(!can("workers"))return this.deny();
  var self=this,ws=sc(DB.workers).slice().sort(function(a,b){return(a.nom+a.prenom)<(b.nom+b.prenom)?-1:1}),d=today();
  return this.sec("Équipe — "+this.T("worker")+"s","Chaque personne a une fiche, un identifiant unique et un badge QR")+
  "<button class=\"bigbtn\" onclick=\"App.addWorkerSheet()\">➕ Ajouter un "+this.T("worker").toLowerCase()+"</button>"+

  ws.map(function(w){var r=computeDay(w.id,d),b=self.badgeOf(w.id);
    return"<div class=\"lrow\" onclick=\"App.workerSheet('"+w.id+"')\" style=\"cursor:pointer\">"+
    "<div class=\"avatar\">"+(w.photo?"<img src=\""+w.photo+"\">":"👷")+"</div>"+
    "<div class=\"grow\"><div class=\"nm\">"+esc(w.prenom+" "+w.nom)+" <span class=\"pill "+(w.statut==="actif"?"ok":"no")+"\">"+w.statut+"</span></div>"+
    "<div class=\"sub\">"+esc(w.matricule)+" · "+esc(w.poste||"—")+" · "+esc(self.siteById(w.siteId)?self.siteById(w.siteId).nom:"sans "+self.T("site").toLowerCase())+"</div></div>"+
    "<div style=\"text-align:right\"><div class=\"small\" style=\"font-weight:800\">"+(r.arrivee?(r.depart?"✓":"🟢"):"—")+"</div><div class=\"mut small\">"+(r.arrivee?fmtH(r.effectif):"")+"</div></div></div>"}).join("")+
  (!ws.length?"<div class=\"msg inf\">Aucun travailleur enregistré. Touche « Ajouter un travailleur » : photo, nom, métier, site — c’est tout.</div>":"")},
nextMat:function(){var n=sc(DB.workers).length+1;return"PP-"+new Date().getFullYear().toString().slice(-2)+"-"+("000"+n).slice(-4)},
addWorkerSheet:function(){var sites=sc(DB.sites);
  this.sheet("<div class=\"h\" style=\"margin-bottom:10px\">Nouveau "+this.T("worker")+"</div>"+
  "<div style=\"text-align:center;margin-bottom:12px\"><div class=\"avatar\" style=\"width:88px;height:88px;margin:0 auto\" id=\"phPrev\">📷</div>"+
  "<input type=\"file\" id=\"w_photo\" accept=\"image/*\" capture=\"environment\" style=\"display:none\" onchange=\"App.takePhoto(this)\">"+
  "<button class=\"btn sm\" style=\"margin-top:8px\" onclick=\"document.getElementById('w_photo').click()\">📸 Prendre la photo</button></div>"+
  "<label class=\"fld\">Nom *</label><input id=\"w_nom\" placeholder=\"Ex : Diop\">"+

  "<label class=\"fld\">"+this.T("site")+" d’affectation</label><select id=\"w_site\" onchange=\"App.siteSelChg(this)\">"+sites.map(function(s){return"<option value=\""+s.id+"\">"+esc(s.nom)+"</option>"}).join("")+"<option value=\"__new__\">➕ Nouveau "+this.T("site").toLowerCase()+"…</option></select>"+
  "<div class=\"grid2\"><div><label class=\"fld\">Mode de paie</label><select id=\"w_mode\"><option value=\"journalier\">Journalier (par jour)</option><option value=\"horaire\">Horaire</option><option value=\"mensuel\">Mensuel</option><option value=\"forfait\">Forfait</option></select></div>"+
  "<div><label class=\"fld\">Montant à payer par jour (F CFA)</label><input id=\"w_tarif\" type=\"number\" inputmode=\"numeric\" value=\"0\"></div></div>"+

  "<div><label class=\"fld\">Jour de départ (si connu)</label><input id=\"w_df\" type=\"date\"></div></div>"+

takePhoto:function(inp){var f=inp.files&&inp.files[0];if(!f)return;
  var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){
    var c=document.createElement("canvas"),max=400,sc2=Math.min(1,max/Math.max(img.width,img.height));
    c.width=Math.round(img.width*sc2);c.height=Math.round(img.height*sc2);

    App.newPhoto=c.toDataURL("image/jpeg",0.8);
    var p=document.getElementById("phPrev");p.innerHTML="<img src=\""+App.newPhoto+"\" style='width:100%;height:100%;object-fit:cover'>"};img.src=rd.result};

workerSheet:function(id,isNew){var w=this.workerById(id);if(!w)return;

  "<label class=\"fld\">Téléphone</label><input id=\"e_tel\" value=\""+esc(w.tel||"")+"\">"+
  "<div style=\"margin-top:16px\" class=\"grid2\"><button class=\"btn primary\" onclick=\"App.saveEditWorker('"+w.id+"')\">✔ Enregistrer</button><button class=\"btn\" onclick=\"App.closeSheet()\">Annuler</button></div>")},
saveEditWorker:function(id){var w=this.workerById(id);if(!w)return;
  var before={nom:w.nom,prenom:w.prenom,poste:w.poste,siteId:w.siteId,tarif:w.tarif};
  w.nom=val("e_nom")||w.nom;w.prenom=val("e_prenom")||w.prenom;w.poste=val("e_poste");w.siteId=val("e_site");
  w.mode=val("e_mode");w.tarif=+val("e_tarif")||0;w.hStart=val("e_hs")||w.hStart;w.hEnd=val("e_he")||w.hEnd;w.tel=val("e_tel");
  w.dateDebut=val("e_dd")||w.dateDebut||today();w.dateFin=val("e_df")||null;
  audit("update","worker",id,before,{nom:w.nom,prenom:w.prenom,poste:w.poste,siteId:w.siteId,tarif:w.tarif},"");
  dbSave();this.closeSheet();this.toast("Fiche mise à jour","ok");this.render()},
toggleWorker:function(id){var w=this.workerById(id);w.statut=w.statut==="actif"?"suspendu":"actif";
  audit("status","worker",id,null,{statut:w.statut},"");dbSave();this.toast("Statut : "+w.statut,"ok");this.closeSheet();this.render()},
siteSelChg:function(sel){if(sel.value!=="__new__"){sel.setAttribute("data-prev",sel.value);return}
  var n=prompt("Nom du nouveau "+this.T("site").toLowerCase()+" :");
  if(!n||!n.trim()){sel.value=sel.getAttribute("data-prev")||"";return}
  var s={id:uid("s"),companyId:this.user().companyId,nom:n.trim(),adresse:"",resp:"",statut:"actif",createdAt:today()};
  DB.sites.push(s);audit("create","site",s.nom,null,null,"");dbSave();
  var o=document.createElement("option");o.value=s.id;o.textContent=s.nom;sel.insertBefore(o,sel.options[sel.options.length-1]);
  sel.value=s.id;sel.setAttribute("data-prev",s.id);this.toast(this.T("site")+" créé ✅","ok")},
renewBadge:function(id){var w=this.workerById(id);
  if(!confirm("Créer un nouveau badge ? L’ancien QR Code sera révoqué et ne permettra plus de pointer."))return;
  sc(DB.badges).forEach(function(b){if(b.workerId===id){b.status="revoked";b.revokedAt=today()}});
  var tok=uid("tk");
  DB.badges.push({id:uid("b"),companyId:this.user().companyId,workerId:id,token:tok,status:"active",createdAt:today(),revokedAt:null,prints:0});
  audit("renew","badge",id,null,{token:tok},"Renouvellement badge");
  notify("Badge renouvelé pour "+w.prenom+" "+w.nom,"wn");
  dbSave();this.closeSheet();this.workerSheet(id);this.toast("Nouveau badge actif ✅","ok")},
releve:function(id){this.reportsDocx("releve",[id],this.dateAdd(today(),-6),today())},
dateAdd:function(iso,n){var d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return today(d)},
// ---------- EXPORT BADGE WORD (.docx réel, dimensions exactes 85,6 × 54 mm) ----------
badgeTableXml:function(w,ridQ,ridP,ridL){var c=this.myCompany(),b=this.badgeOf(w.id);
  var mtw=mmTw(85.6),mh=mmTw(54);
  function p(run){return"<w:p><w:pPr><w:spacing w:after=\"0\" w:line=\"0\" w:lineRule=\"exact\"/></w:pPr>"+(run||"")+"</w:p>"}
  function t(s,sz,bold,color){return"<w:r><w:rPr>"+(bold?"<w:b/>":"")+"<w:color w:val=\""+(color||"1e293b")+"\"/><w:sz w:val=\""+sz+"\"/></w:rPr><w:t>"+escX(s)+"</w:t></w:r>"}
  // disposition : table à 1 ligne, 3 colonnes (photo 22mm | identité | QR 22mm)
  return"<w:tbl><w:tblPr><w:tblW w:w=\""+mtw+"\" w:type=\"dxa\"/>"+
  "<w:tblBorders>"+["top","left","bottom","right"].map(function(s){return"<w:"+s+" w:val=\"single\" w:sz=\"12\" w:color=\"1e293b\"/>"}).join("")+"</w:tblBorders><w:tblLayout w:type=\"fixed\"/></w:tblPr>"+
  "<w:tblGrid><w:gridCol w:w=\""+mmTw(26)+"\"/><w:gridCol w:w=\""+(mtw-mmTw(26)-mmTw(24))+"\"/><w:gridCol w:w=\""+mmTw(24)+"\"/></w:tblGrid>"+
  "<w:tr><w:trPr><w:trHeight w:val=\""+mh+"\" w:hRule=\"exact\"/></w:trPr>"+
  // photo
  "<w:tc><w:tcPr><w:tcW w:w=\""+mmTw(26)+"\" w:type=\"dxa\"/><w:shd w:val=\"clear\" w:fill=\"0e7490\"/></w:tcPr>"+
  p(ridP?docxImg(ridP,20,26):t("",10))+p(t(escX(w.matricule),11,true,"ffffff"))+
  "</w:tc>"+
  // identité
  "<w:tc><w:tcPr><w:tcW w:w=\""+(mtw-mmTw(26)-mmTw(24))+"\" w:type=\"dxa\"/></w:tcPr>"+
  p((ridL?docxImg(ridL,9,5):"")+t(c?c.name:"",9,true,"0e7490"))+
  p(t(w.nom+" "+w.prenom,17,true))+p(t(w.poste||"",11,false,"475569"))+
  p(t("ID : "+w.matricule,10,true,"334155"))+
  "</w:tc>"+
  // QR
  "<w:tc><w:tcPr><w:tcW w:w=\""+mmTw(24)+"\" w:type=\"dxa\"/></w:tcPr>"+
  p(ridQ?docxImg(ridQ,21,21):"")+p(t("POINTPRO",8,true,"94a3b8"))+
  "</w:tc></w:tr></w:tbl>"},
docxForBadges:function(list){var self=this,rels="",files=[],rid=100;
  var xml="";
  list.forEach(function(w,i){var b=self.badgeOf(w.id);
    var rq="rId"+(rid++),rp="rId"+(rid++),rl="rId"+(rid++);
    rels+="<Relationship Id=\""+rq+"\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/image\" Target=\"media/qr"+i+".png\"/>";
    files.push({name:"word/media/qr"+i+".png",data:qrPng(b.token,10)});
    if(w.photo){var b64=w.photo.split(",")[1];rels+="<Relationship Id=\""+rp+"\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/image\" Target=\"media/ph"+i+".jpeg\"/>";
      files.push({name:"word/media/ph"+i+".jpeg",data:b64dec(b64)})}else rp=null;
    var c=self.myCompany();
    if(c&&c.logo){var l64=c.logo.split(",")[1];rels+="<Relationship Id=\""+rl+"\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/image\" Target=\"media/lg"+i+".png\"/>";
      files.push({name:"word/media/lg"+i+".png",data:b64dec(l64)})}else rl=null;
    xml+=self.badgeTableXml(w,rq,rp,rl);
    if(i<list.length-1)xml+="<w:p><w:pPr><w:spacing w:after=\"60\"/></w:pPr></w:p>"});
  return buildDocx(xml+"<w:p><w:pPr><w:spacing w:after=\"0\"/></w:pPr></w:p>",{rels:rels,files:files})},
badgePng:function(id){var self=this,w=this.workerById(id);if(!w)return;
  var b=this.badgeOf(w.id),c=this.myCompany(),cv=document.createElement("canvas");
  cv.width=856;cv.height=540;var g=cv.getContext("2d");
  var qr=new Image(),ph=new Image(),hasQr=!!b,hasPh=!!w.photo;
  if(hasQr)qr.src=qrDataUrl(b.token,6);
  if(hasPh)ph.src=w.photo;
  var n=0,need=(hasQr?1:0)+(hasPh?1:0);
  function done(){if(++n>=need)setTimeout(draw,50)}
  function draw(){
    g.fillStyle="#0f172a";g.fillRect(0,0,856,540);
    g.fillStyle="#0e7490";g.fillRect(0,0,222,540);
    g.strokeStyle="#22d3ee";g.lineWidth=5;g.strokeRect(8,8,840,524);
    g.fillStyle="#334155";g.fillRect(26,26,170,220);
    if(hasPh&&ph.complete&&ph.naturalWidth){g.save();g.beginPath();g.rect(26,26,170,220);g.clip();g.drawImage(ph,26,26,170,220);g.restore()}
    else{g.fillStyle="#94a3b8";g.font="bold 26px Arial";g.textAlign="center";g.fillText("PHOTO",111,145)}
    g.fillStyle="#fff";g.font="bold 20px Arial";g.textAlign="center";g.fillText(w.matricule,111,290);
    g.textAlign="left";g.fillStyle="#22d3ee";g.font="bold 24px Arial";
    g.fillText(String(c?c.name:"").slice(0,32),252,72);
    g.fillStyle="#fff";g.font="bold 46px Arial";g.fillText(String(w.prenom+" "+w.nom).slice(0,22),252,150);
    g.fillStyle="#cbd5e1";g.font="bold 27px Arial";g.fillText(String(w.poste||"Travailleur").slice(0,28),252,205);
    g.fillStyle="#e2e8f0";g.font="bold 25px Arial";g.fillText("ID : "+w.matricule,252,258);
    g.fillStyle="#94a3b8";g.font="bold 18px Arial";g.fillText("Badge officiel — à présenter au pointage",252,305);
    g.fillStyle="#64748b";g.font="16px Arial";g.fillText((c&&c.ville?String(c.ville).slice(0,24):"")+" · POINTPRO",252,340);
    if(hasQr&&qr.complete&&qr.naturalWidth){g.drawImage(qr,620,325,200,200)}
    g.fillStyle="#22d3ee";g.font="bold 21px Arial";g.textAlign="center";g.fillText("POINTPRO",720,312);
    cv.toBlob(function(blob){if(!blob){self.toast("Erreur génération image","no");return}
      var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="badge_"+w.matricule+".png";document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},4000);
      self.toast("Badge image téléchargé ✅ Imprime-le depuis ta galerie (format carte 85,6 × 54 mm)","ok")},"image/png")}
  if(!need)draw();
  else{if(hasQr){qr.onload=done;qr.onerror=done}if(hasPh){ph.onload=done;ph.onerror=done}}
},
badgeDocx:function(id){var w=this.workerById(id);if(!w)return;
  try{dl(this.docxForBadges([w]),"badge_"+w.matricule+".docx");this.toast("Badge Word téléchargé ✅","ok");this.closeSheet()}
  catch(e){this.toast("Erreur export : "+e.message,"no")}},
badgesSheetDocx:function(ids){var list=ids.map(function(id){return App.workerById(id)}).filter(Boolean);
  try{dl(this.docxForBadges(list),"badges_planche_"+today()+".docx");this.toast(list.length+" badge(s) Word ✅","ok")}
  catch(e){this.toast("Erreur export : "+e.message,"no")}},
printBadges:function(ids){var self=this,list=ids.map(function(id){return self.workerById(id)}).filter(Boolean);
  var html="<div style='max-width:800px;margin:auto;padding-top:56px'>"+list.map(function(w){return"<div style='width:85.6mm;height:54mm;margin:4mm auto'>"+self.badgeHtml(w)+"</div>"}).join("")+"</div>";
  var w=window.open("","_blank");if(!w){this.toast("Autorise les fenêtres surgissantes","no");return}
  w.document.write("<!doctype html><html><head><meta charset='utf-8'><title>Badges POINTPRO</title>"+
  "<style>body{font-family:Arial;background:#fff;margin:10mm}.noprint{position:fixed;top:0;left:0;right:0;padding:10px;background:#0b1220;z-index:9;display:flex;gap:8px;justify-content:center}.noprint button{padding:10px 18px;font-size:15px;border:0;border-radius:10px;background:#0e7490;color:#fff}@media print{.noprint{display:none!important}body{margin:0;padding-top:0}.b{page-break-after:always}}</style></head><body>"+
  "<div class='noprint'><button onclick='window.close()'>← Retour à l’app</button><button onclick='window.print()'>🖨️ Imprimer / PDF</button></div>"+
  html.replace(/85\.6mm/g,"width:100%")+"</body></html>");
  w.document.close();setTimeout(function(){w.print()},600)}
});
</script>
<script>
// ================== SCANNER & SESSIONS ==================
Object.assign(App,{
vScan:function(){if(!can("scan"))return this.deny();
  var sites=sc(DB.sites),d=today();
  var sess=this.todaySession();
  return this.sec("Pointage — scan continu","Scanne successivement chaque badge : aucune manipulation entre les scans")+
  "<div class=\"sw\"><div class=\"chip"+(this.scan.mode==="auto"?" on":"")+"\" onclick=\"App.setMode('auto')\">🤖 Auto</div>"+
  ["arrivee","depart","pauseDebut","pauseFin"].map(function(m){return"<div class=\"chip"+(App.scan.mode===m?" on":"")+"\" onclick=\"App.setMode('"+m+"')\">"+OPS[m]+"</div>"}).join("")+"</div>"+
  (sess?"<div class=\"msg ok\"><b>Session ouverte</b> · "+esc(this.siteById(sess.siteId)?this.siteById(sess.siteId).nom:"")+" · par "+esc(sess.byName)+" · "+sess.openedAt+"</div>":
  "<div class=\"msg wn\">Aucune session ouverte aujourd’hui sur ce site. Ouvre-en une pour tracer les opérations.</div>"+
  "<button class=\"btn blk\" onclick=\"App.openSession()\">▶ Ouvrir une session de pointage</button>")+
  (this.scan.on?
  "<div id=\"scanbox\"><video id=\"scv\" autoplay playsinline muted></video><div id=\"scanframe\"></div><div id=\"scanflash\"></div>"+
  "<div style=\"position:absolute;top:8px;left:8px;display:flex;gap:8px\">"+
  "<button class=\"btn sm\" onclick=\"App.stopScan()\">✕ Arrêter</button>"+
  "<button class=\"btn sm\" id=\"torchBtn\" onclick=\"App.toggleTorch()\">🔆 Torche</button></div></div>"+
  "<div id=\"scanStatus\" style=\"text-align:center;padding:12px;font-weight:800\">Scanne un badge…</div>"+
  "<div class=\"grid3\" style=\"margin-bottom:10px\"><div class=\"counter\">Scans : <span id=\"cTot\">"+this.scan.count+"</span></div>"+
  "<div class=\"counter\" style=\"color:#6ee7b7\">✓ <span id=\"cOk\">"+this.scan.ok+"</span></div>"+
  "<div class=\"counter\" style=\"color:#fca5a5\">✕ <span id=\"cRej\">"+this.scan.rej+"</span></div></div>"+
  "<div id=\"lastScan\"></div><div id=\"recentScans\" style=\"margin-top:8px\">"+this.recentScansHtml()+"</div>"
  :
  "<div style=\"text-align:center;padding:20px 0\">"+
  (window.BarcodeDetector?"":"<div class=\"msg wn\">Ce navigateur n’a pas de lecteur QR natif : le scan caméra nécessitera Chrome Android récent. En attendant, utilise la saisie manuelle ci-dessous — elle enregistre exactement les mêmes données.</div>")+
  "<button class=\"bigbtn\" onclick=\"App.startScan()\">📷 DÉMARRER LE SCAN CONTINU</button>"+
  "<div class=\"card\" style=\"margin-top:14px;text-align:left\"><h3>⌨️ Saisie manuelle</h3>"+
  "<label class=\"fld\">Identifiant du badge ou matricule</label><input id=\"manualTk\" placeholder=\"Ex : PP-26-0001\">"+
  "<button class=\"btn blk\" style=\"margin-top:10px\" onclick=\"App.manualScan()\">Valider le pointage</button></div></div>")},
recentScansHtml:function(){var rec=(this.scan.last||[]);return rec.map(function(r){
  return"<div class=\"lrow\" style=\"padding:8px\"><div class=\"avatar\" style=\"width:36px;height:36px;font-size:16px\">"+(r.ok?"✓":"✕")+"</div>"+
  "<div class=\"grow\"><div class=\"nm\" style=\"font-size:14px\">"+esc(r.nom)+"</div><div class=\"sub\"><b>"+wLabel(r.date||today())+" "+dLabel(r.date||today())+"</b> · "+esc(r.op)+" · "+r.time+(r.anomaly?" · ⚠":"")+"</div></div></div>"}).join("")},
setMode:function(m){this.scan.mode=m;this.render()},
todaySession:function(){var d=today(),sid=this.scan.siteId;
  return sc(DB.sessions).filter(function(s){return s.date===d&&s.siteId===sid&&!s.closedAt})[0]||null},
openSession:function(){var u=this.user();
  DB.sessions.push({id:uid("se"),companyId:u.companyId,siteId:this.scan.siteId,date:today(),openedAt:nowTime(),
    byId:u.id,byName:u.name,closedAt:null,expected:sc(DB.workers).filter(function(w){return w.statut==="actif"&&w.siteId===App.scan.siteId}).length});
  audit("open","session",this.scan.siteId,null,null,"");dbSave();this.toast("Session ouverte ✅","ok");this.render()},
closeSession:function(){var s=this.todaySession();if(!s)return;
  s.closedAt=nowTime();
  var evs=sc(DB.events).filter(function(e){return e.sessionId===s.id});
  s.summary={scans:evs.length,workers:new Set(evs.map(function(e){return e.workerId})).size,anomalies:evs.filter(function(e){return e.anomaly}).length};
  audit("close","session",s.id,null,s.summary,"");dbSave();this.toast("Session clôturée","ok");this.render()},
startScan:function(){var self=this;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){this.toast("Caméra indisponible : utilise la saisie manuelle","no");return}
  this.scan.on=true;this.scan.count=0;this.scan.ok=0;this.scan.rej=0;this.scan.last=[];
  this.render();
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}).then(function(stream){
    self.scan.stream=stream;
    var v=document.getElementById("scv");if(v){v.srcObject=stream;v.setAttribute("playsinline","true")}
    if(window.BarcodeDetector){try{self.scan.detector=new BarcodeDetector({formats:["qr_code"]})}catch(e){self.scan.detector=null}}
    else self.scan.detector=null;
    if(!self.scan.detector){document.getElementById("scanStatus").innerHTML="Lecteur natif indisponible sur ce navigateur. Utilise la saisie manuelle.";}
    self.scanLoop();
  }).catch(function(e){self.scan.on=false;self.toast("Accès caméra refusé : "+e.message,"no");self.render()})},
scanLoop:function(){var self=this;if(!this.scan.on)return;
  var v=document.getElementById("scv");if(!v)return;
  if(this.scan.detector){
    this.scan.detector.detect(v).then(function(codes){
      if(codes&&codes.length){var raw=codes[0].rawValue;self.handleScan(raw)}
      setTimeout(function(){self.scanLoop()},450)}).catch(function(){setTimeout(function(){self.scanLoop()},800)})}
},
stopScan:function(){this.scan.on=false;
  if(this.scan.stream){this.scan.stream.getTracks().forEach(function(t){t.stop()});this.scan.stream=null}
  this.scan.detector=null;this.render()},
toggleTorch:function(){var tr=this.scan.stream&&this.scan.stream.getVideoTracks()[0];
  if(tr&&tr.applyConstraints&&tr.getCapabilities&&tr.getCapabilities().torch){
    this.torchOn=!this.torchOn;var self=this;
    tr.applyConstraints({advanced:[{torch:this.torchOn}]}).catch(function(){self.toast("Torche non supportée","no")})}
  else this.toast("Torche non supportée sur cet appareil","no")},
beep:function(ok){try{var ac=this.ac||new(window.AudioContext||window.webkitAudioContext)();this.ac=ac;
  var o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=ok?880:220;
  g.gain.value=0.25;o.connect(g);g.connect(ac.destination);o.start();setTimeout(function(){o.stop()},ok?120:300)}catch(e){}},
flash:function(ok){var f=document.getElementById("scanflash");if(!f)return;
  f.style.background=ok?"#34d399":"#f87171";f.style.opacity=0.55;setTimeout(function(){f.style.opacity=0},220)},
manualScan:function(){var t=val("manualTk").trim();if(!t){this.toast("Saisis un identifiant","no");return}
  this.handleScan(t);document.getElementById("manualTk").value=""},
// ---- VALIDATION D’UN SCAN (cœur métier anti-fraude) ----
handleScan:function(raw){raw=String(raw||"").trim();if(!raw)return;
  var u=this.user(),siteId=this.scan.siteId,d=today(),t=nowTime();
  var self=this;
  function reject(msg){self.scan.count++;self.scan.rej++;self.scan.last.unshift({ok:false,nom:raw.slice(0,24),op:msg,time:t,date:self.today(),anomaly:true});
    self.scan.last=self.scan.last.slice(0,10);self.beep(false);self.flash(false);updStatus(msg,false);
    var st=document.getElementById("cRej");if(st)st.textContent=self.scan.rej;
    var ls=document.getElementById("lastScan");if(ls)ls.innerHTML="<div class=\"msg no\">✕ "+esc(msg)+"</div>";
    var rs=document.getElementById("recentScans");if(rs)rs.innerHTML=self.recentScansHtml()}
  function updStatus(msg,ok){var s=document.getElementById("scanStatus");if(s)s.innerHTML=(ok?"✓ ":"✕ ")+esc(msg)}
  // accepte : token complet OU matricule (saisie manuelle)
  var b=sc(DB.badges).find(function(x){return x.token===raw&&x.status==="active"});
  var w=null;
  if(!b){w=sc(DB.workers).find(function(x){return x.matricule===raw&&x.statut==="actif"});
    if(w)b=this.badgeOf(w.id);
    if(!b){reject("QR Code / badge inconnu ou désactivé");notify("Scan refusé : badge inconnu (« "+raw.slice(0,20)+" »)","no");return}}
  w=this.workerById(b.workerId);
  if(!w||w.companyId!==u.companyId){reject("Badge inconnu dans ton entreprise");return}
  if(w.statut!=="actif"){reject(w.prenom+" "+w.nom+" est suspendu : pointage refusé");return}
  // état du jour
  var day=computeDay(w.id,d);
  var mode=this.scan.mode,proposed=mode;
  if(mode==="auto"){
    if(!day.arrivee)proposed="arrivee";
    else if(day.arrivee&&!day.depart&&day.pauses.length&&day.pauses[day.pauses.length-1][1]===null)proposed="pauseFin";
    else if(day.arrivee&&!day.depart)proposed=(day.pauses.length&&new Date().getHours()>=12)?"pauseDebut":"depart";
    else proposed="depart";
    if(day.depart){reject(w.prenom+" "+w.nom+" a déjà pointé le départ aujourd’hui");return}}
  // doublons
  var exists=sc(DB.events).find(function(e){return e.workerId===w.id&&e.date===d&&e.type===proposed});
  if(exists){reject(w.prenom+" "+w.nom+" : « "+OPS[proposed]+" » déjà enregistré à "+exists.time);return}
  if(proposed==="depart"&&!day.arrivee){reject("Départ sans arrivée : impossible");return}
  if(proposed==="pauseFin"&&!(day.pauses.length&&day.pauses[day.pauses.length-1][1]===null)){reject("Fin de pause sans pause en cours");return}
  // cohérence site
  var anomaly=false;
  if(w.siteId&&w.siteId!==siteId)anomaly=true;
  var sess=this.todaySession();
  var ev={id:uid("e"),companyId:u.companyId,sessionId:sess?sess.id:null,workerId:w.id,badgeId:b.id,
    type:proposed,date:d,time:t,ts:new Date().toISOString(),byUserId:u.id,byName:u.name,
    sessionSiteId:siteId,offline:!navigator.onLine,anomaly:anomaly,note:anomaly?("Affecté à "+(this.siteById(w.siteId)?this.siteById(w.siteId).nom:"?")+" mais pointé sur "+(this.siteById(siteId)?this.siteById(siteId).nom:"?")):"",synced:true};

periodDays:function(ym){var y=+ym.slice(0,4),m=+ym.slice(5),out=[],d=new Date(y,m-1,1);
  while(d.getMonth()===m-1){out.push(today(d));d.setDate(d.getDate()+1)}return out},
payOf:function(w,ym){var days=this.periodDays(ym),self=this,totH=0,totHS=0,validDays=0,rawDays=0;
  // bornes contractuelles : seuls les jours entre début et départ sont comptés
  var deb=w.dateDebut||null,fin=w.dateFin||null;
  days.forEach(function(d){if(deb&&d<deb)return;if(fin&&d>fin)return;
    var r=self.computeDayC(w.id,d);if(r.arrivee){rawDays++;totH+=r.effectif;totHS+=r.hs;
    if(self.dayValidated(w.id,d))validDays++}});
  var est=0;
  if(w.mode==="journalier")est=validDays*w.tarif;
  else if(w.mode==="horaire")est=totH*w.tarif+totHS*w.tarif*(this.hsMajor()||1);

setLogo:function(inp){var f=inp.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){var img=new Image();img.onload=function(){var c2=document.createElement("canvas"),mx=300,s=Math.min(1,mx/Math.max(img.width,img.height));
    c2.width=Math.round(img.width*s);c2.height=Math.round(img.height*s);c2.getContext("2d").drawImage(img,0,0,c2.width,c2.height);
    var c=App.myCompany();c.logo=c2.toDataURL("image/png");audit("update","company","logo",null,"logo","");dbSave();App.toast("Logo enregistré ✅","ok");App.render()};img.src=rd.result};
  rd.readAsDataURL(f)},
backupExport:function(){var data=JSON.stringify(DB);dl(u8(data),"pointpro_sauvegarde_"+today()+".json","application/json");this.toast("Sauvegarde téléchargée ✅","ok")},
pwaKit:function(){
  function icon(sz){var c=document.createElement("canvas");c.width=sz;c.height=sz;var x=c.getContext("2d");
    x.fillStyle="#0b1220";x.fillRect(0,0,sz,sz);
    x.fillStyle="#22d3ee";x.beginPath();x.arc(sz/2,sz/2,sz*0.38,0,7);x.fill();
    x.fillStyle="#0b1220";x.font="bold "+Math.round(sz*0.3)+"px Arial";x.textAlign="center";x.textBaseline="middle";x.fillText("PP",sz/2,sz*0.54);
    return b64dec(c.toDataURL("image/png").split(",")[1])}
  var man=JSON.stringify({name:"POINTPRO — Pointage",short_name:"POINTPRO",start_url:"./index.html",scope:"./",
    display:"standalone",orientation:"portrait",background_color:"#0b1220",theme_color:"#0b1220",
    icons:[{src:"icon-192.png",sizes:"192x192",type:"image/png"},{src:"icon-512.png",sizes:"512x512",type:"image/png"}]},null,1);
  var sw="var C='pointpro-v1';self.addEventListener('install',function(e){self.skipWaiting()});"+
    "self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim())});"+
    "self.addEventListener('fetch',function(e){e.respondWith(caches.match(e.request).then(function(r){return r||"+
    "fetch(e.request).then(function(res){var cl=res.clone();caches.open(C).then(function(c){c.put(e.request,cl)});return res})"+
    ".catch(function(){return caches.match('./index.html')})}))});";
  dl(u8(sw),"sw.js","text/javascript");
  dl(u8(man),"manifest.json","application/json");
  dl(icon(192),"icon-192.png","image/png");
  dl(icon(512),"icon-512.png","image/png");
  this.toast("Kit PWA téléchargé (4 fichiers) — mets-les à côté d’index.html sur ton hébergement HTTPS, puis « Ajouter à l’écran d’accueil »","ok")},
backupImport:function(inp){var f=inp.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var d=JSON.parse(rd.result);if(!d.companies)throw new Error("Fichier invalide");
    DB=d;dbSave();App.toast("Sauvegarde restaurée ✅","ok");App.logout()}catch(e){App.toast("Erreur : "+e.message,"no")}};
  rd.readAsText(f)},
// ---------- GUIDES ----------
vGuides:function(){return this.sec("Guides & FAQ","Tout utilisateur, même débutant, peut maîtriser POINTPRO")+
  "<details class=\"faq\" open><summary>🚀 Guide utilisateur — démarrer en 5 minutes</summary><div class=\"b\">"+
  "1. <b>Pointeur :</b> onglet 📷 Pointer → ouvre une session → choisis le mode (Auto recommandé) → DÉMARRER LE SCAN CONTINU → scanne chaque badge. Le bip vert confirme, le rouge alerte. Aucun retour au menu nécessaire.<br>"+
  "2. <b>Responsable :</b> onglet 👥 Équipe → « Ajouter un travailleur » → photo + nom + métier + site → le badge QR est généré automatiquement → exporte-le en Word ou imprime-le.<br>"+
  "3. Chaque soir : onglet Plus → ⏱️ Heures → vérifie les journées (retards, incomplètes) → corrige si besoin avec motif → valide.<br>"+
  "4. En fin de mois : Plus → 💵 Rémunérations → les montants estimés se calculent sur les journées validées → enregistre les paiements → exporte le rapport mensuel Word/Excel/PDF.<br>"+
  "5. Hors connexion : tout fonctionne ; les pointages sont marqués « hors ligne » et restent à vérifier.</div></details>"+
  "<details class=\"faq\"><summary>🛠️ Guide administrateur</summary><div class=\"b\">"+
  "· Crée les comptes dans Plus → 👤 Utilisateurs (pointeur, responsable, comptable, ouvrier…). Chaque rôle n’a accès qu’à ses écrans.<br>"+
  "· Renseigne l’identité et le logo de l’entreprise (Plus → 🏢 Mon entreprise) : ils s’affichent sur les badges et tous les rapports.<br>"+
  "· Le secteur d’activité adapte le vocabulaire de l’app (chantier/ouvier pour le BTP, site client/agent pour la sécurité…).<br>"+
  "· Toute correction ou validation est tracée dans le journal d’audit (qui, quand, avant/après, motif).<br>"+
  "· Sauvegarde régulière : Plus → 💾 Sauvegarde (fichier JSON à conserver).</div></details>"+
  "<details class=\"faq\"><summary>📱 Installer POINTPRO sur un smartphone</summary><div class=\"b\">"+
  "POINTPRO est une application web mobile :<br>· <b>Android (Chrome) :</b> héberge le fichier (voir ci-dessous), ouvre l’adresse → menu ⋮ → « Ajouter à l’écran d’accueil ». L’app s’ouvre en plein écran comme une vraie application.<br>"+
  "· <b>iPhone (Safari) :</b> ouvre l’adresse → bouton Partager → « Sur l’écran d’accueil ».<br>"+
  "· Le scan caméra nécessite <b>HTTPS</b> et fonctionne nativement sur Chrome Android (lecteur QR intégré). Sur un navigateur sans lecteur natif, la saisie manuelle du matricule enregistre exactement les mêmes données.</div></details>"+
  "<details class=\"faq\"><summary>🌐 Déploiement (multi-appareils)</summary><div class=\"b\">"+
  "Cette version fonctionne <b>hors ligne sur un seul appareil</b> (les données restent dans le navigateur). Pour l’installer sur plusieurs téléphones et partager les données :<br>"+
  "1. Héberge le fichier HTML sur un hébergement statique HTTPS gratuit (Netlify Drop, GitHub Pages, Firebase Hosting) en le renommant <code>index.html</code>.<br>"+
  "2. Touche <b>« 📱 Générer le kit d’installation PWA »</b> (menu Plus, sous Sauvegarde) : 4 fichiers sont téléchargés — <code>manifest.json</code>, <code>sw.js</code>, <code>icon-192.png</code>, <code>icon-512.png</code>. Place-les dans le <b>même dossier</b> qu’<code>index.html</code>. L’app s’installe alors comme une vraie application (icône sur l’écran d’accueil, plein écran, fonctionne hors ligne).<br>"+
  "3. <b>Synchronisation multi-appareils :</b> l’architecture est prête (chaque événement a un identifiant unique anti-doublon), mais un serveur (ex. Supabase, ~gratuit) doit y être branché — c’est la phase 2 recommandée avant une utilisation multi-pointeurs simultanée.</div></details>"+
  "<details class=\"faq\"><summary>📖 Glossaire</summary><div class=\"b\">"+
  "<b>Badge</b> : carte QR personnelle, révocable. · <b>Session de pointage</b> : période ouverte par le pointeur sur un site (traçabilité). · <b>Absent présumé</b> : travailleur actif sans arrivée enregistrée — à vérifier, jamais une absence confirmée. · <b>Journée validée</b> : journée vérifiée par un responsable ; seule base du calcul de paie. · <b>Anomalie</b> : pointage hors site affecté — enregistré mais signalé en orange. · <b>HS</b> : heures au-delà de la base horaire du travailleur. · <b>Total à payer</b> : montant calculé automatiquement (montant/jour × journées validées) sur la période contractuelle [premier jour de travail → jour de départ].</div></details>"+
  "<details class=\"faq\"><summary>🔐 Sécurité & données personnelles</summary><div class=\"b\">"+
  "· Isolation stricte : chaque requête filtre par entreprise ; un pointeur ne voit jamais les données d’une autre entreprise (testé dans les auto-tests).<br>"+
  "· Le QR Code contient un identifiant aléatoire, <b>jamais</b> de données personnelles.<br>"+
  "· Un badge révoqué est immédiatement refusé au scan ; les doublons sont bloqués.<br>"+
  "· Un scan QR n’est pas une preuve absolue de présence : c’est pourquoi sessions, anomalies et validation humaine existent. Les événements saisis hors ligne sont marqués comme tels.<br>"+
  "· Les données restent sur l’appareil : exporte la sauvegarde avant de changer de téléphone. La géolocalisation n’est pas activée par défaut ; toute activation doit respecter la réglementation applicable (données personnelles, Sénégal).</div></details>"},
// ---------- AUTO-TESTS ----------
vTests:function(){var t=this.runTests();
  return this.sec("Auto-tests intégrés","Vérification en direct des fonctions critiques — résultats réels, calculés à l’instant")+
  t.map(function(r){return"<div class=\"lrow\" style=\"padding:10px\"><div style=\"font-size:18px\">"+(r.ok?"✅":"❌")+"</div>"+
  "<div class=\"grow\"><div class=\"nm\" style=\"font-size:14px\">"+r.name+"</div><div class=\"sub\">"+esc(r.detail)+"</div></div></div>"}).join("")+
  "<div class=\"msg "+(t.every(function(r){return r.ok})?"ok":"no")+"\"><b>"+t.filter(function(r){return r.ok}).length+" / "+t.length+" tests réussis.</b> Les tests physiques (impression réelle des badges, scan caméra sur appareil) se vérifient sur le terrain : exporte un badge Word, mesure 85,6 × 54 mm, scanne le QR avec l’app elle-même (onglet Pointer → saisie manuelle du token du badge à tester, ou scan du badge imprimé).</div>"},
runTests:function(){var T=[],self=this;
  function t(name,ok,detail){T.push({name:name,ok:!!ok,detail:detail||""})}
  try{
    // 1. calcul heures : exemple du cahier des charges (08-12 / 13-17)
    var evs=[["08:00","arrivee"],["12:00","pauseDebut"],["13:00","pauseFin"],["17:00","depart"]];
    var cid=this.user().companyId,wid=uid("tw");
    DB.workers.push({id:wid,companyId:cid,matricule:"TEST-0001",nom:"Test",prenom:"Heures",photo:null,poste:"",siteId:null,mode:"horaire",tarif:0,hStart:"08:00",hEnd:"17:00",hsBase:8,statut:"actif"});
    var d1=today();var sess=null;
    evs.forEach(function(e){DB.events.push({id:uid("te"),companyId:cid,sessionId:null,workerId:wid,badgeId:null,type:e[1],date:d1,time:e[0],sessionSiteId:null,anomaly:false})});
    var r=computeDay(wid,d1);
    t("Calcul heures (08h-12h/13h-17h)",Math.round(r.presence*10)===90&&r.pauseTot===1&&Math.round(r.effectif*10)===80,"Présence "+fmtH(r.presence)+", pause "+fmtH(r.pauseTot)+", effectif "+fmtH(r.effectif)+" — attendu 9h / 1h / 8h");
    // 2. passage de minuit
    var wid2=uid("tw");DB.workers.push({id:wid2,companyId:cid,matricule:"TEST-0002",nom:"Nuit",prenom:"Test",photo:null,poste:"",siteId:null,mode:"horaire",tarif:0,hStart:"22:00",hEnd:"06:00",hsBase:8,statut:"actif"});
    DB.events.push({id:uid("te"),companyId:cid,workerId:wid2,type:"arrivee",date:d1,time:"22:00"});
    DB.events.push({id:uid("te"),companyId:cid,workerId:wid2,type:"depart",date:d1,time:"02:00"});
    var r2=computeDay(wid2,d1);
    t("Travail de nuit + passage de minuit (22h→02h)",Math.round(r2.presence*10)===40,"Présence "+fmtH(r2.presence)+" — attendu 4h");
    // 3. Reed-Solomon auto-cohérent
    var cw=qrEncode("PP-TEST-42").m?null:null;var q=qrEncode("PP-TEST-42");
    t("QR : matrice générée (v"+(q.size===21?1:q.size===25?2:3)+")",q.size===21||q.size===25||q.size===29,"Taille "+q.size+"×"+q.size);
    // 4. format info constant M/masque0 présent aux deux copies
    var fb1=q.m[8][0]===true&&q.m[8][1]===false&&q.m[8][2]===true;
    t("QR : bits de format (M, masque 0)",fb1,"Rangée 8 : "+[0,1,2,3,4,5].map(function(x){return q.m[8][x]?1:0}).join(""));
    // 5. ZIP : signature EOCD + entrées
    var z=zipStore([{name:"a.txt",data:u8("hello")}]);
    var dv=new DataView(z.buffer,z.byteOffset,z.byteLength);
    var eocdOk=false;for(var i=z.length-22;i>0;i--){if(dv.getUint32(i,true)===0x06054b50){eocdOk=dv.getUint16(i+10,true)===1;break}}
    t("ZIP (DOCX/XLSX) : structure EOCD",eocdOk,z.length+" octets, 1 entrée");
    // 6. DOCX badge : dimensions exactes
    var bt=this.badgeTableXml({nom:"Doe",prenom:"John",matricule:"PP-26-0001",poste:"Maçon"},null,null,null);
    t("Badge Word : 85,6 × 54 mm exacts",bt.indexOf(mmTw(85.6)+"")>=0&&bt.indexOf(mmTw(54)+"")>=0,"Twips : "+mmTw(85.6)+" × "+mmTw(54));
    // 7. permissions
    var pOk=PERM.pointeur.indexOf("workers")<0&&PERM.pointeur.indexOf("scan")>=0&&PERM.admin.indexOf("settings")>=0&&PERM.ouvrier.length===1;
    t("Rôles & permissions",pOk,"Le pointeur ne peut pas gérer l’équipe ; l’ouvrier ne voit que son espace");
    // 8. isolation des entreprises
    var c2=uid("c");DB.companies.push({id:c2,name:"Autre",sector:"btp"});
    var beforeLen=DB.workers.filter(function(w){return w.companyId===cid}).length;
    var iso=sc(DB.workers).length===beforeLen;
    DB.companies=DB.companies.filter(function(cc){return cc.id!==c2});
    t("Isolation multi-entreprises",iso,"sc() ne retourne que les travailleurs de ton entreprise");
    // 9. paie journalier
    var wv=DB.workers.find(function(w){return w.id===wid});
    // 1 journée validée × tarif 2500
    DB.validations=DB.validations||[];DB.validations.push({id:uid("v"),companyId:cid,workerId:wid,date:d1});
    wv.mode="journalier";wv.tarif=2500;
    var pay=this.payOf(wv,d1.slice(0,7));
    t("Calcul paie (journalier validé × tarif)",pay.estimated>=2500,"Estimé "+fmM(pay.estimated)+" (1 journée validée × 2 500 F)");
    // 10. QR PNG : signature PNG + CRC
    var png=qrPng(wid,4);var sigOk=png[0]===0x89&&png[1]===0x50;
    t("PNG QR : signature binaire",sigOk,png.length+" octets");
    // nettoyage des données de test
    DB.workers=DB.workers.filter(function(w){return w.id!==wid&&w.id!==wid2});
    DB.events=DB.events.filter(function(e){return e.workerId!==wid&&e.workerId!==wid2});
    DB.validations=DB.validations.filter(function(v){return v.workerId!==wid});
    dbSave();
  }catch(e){t("Exécution des tests",false,"Erreur : "+e.message)}
  return T}
});

  App.scan.siteId=App.firstSite();App.tab=App.user().role==="ouvrier"?"self":"home";App.render()}else App.init();
  if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}});
window.addEventListener("online",function(){App.toast("Connexion rétablie — les pointages hors ligne restent marqués pour vérification","ok")});
</script>
